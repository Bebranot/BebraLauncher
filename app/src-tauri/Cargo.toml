[package]
name = "bebra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BebraLauncher desktop app (Tauri + Svelte)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
bebra-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Registry"] }
time = { version = "0.3", features = ["formatting", "serde-well-known"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
