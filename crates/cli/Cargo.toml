[package]
name = "bebra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debug CLI on top of bebra-core"

[[bin]]
name = "bebra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bebra-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
