[package]
name = "bebra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debug CLI on top of bebra-core"

[[bin]]
name = "bebra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bebra-core = { path = "../core" }
ed25519-dalek = "3.0.0"
getrandom = "0.3"
hex = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.27.0"
