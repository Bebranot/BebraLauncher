[package]
name = "bebra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-less core of the launcher: hub, auth, content download, engine launch"

[dependencies]
blake2 = "0.11.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2", "charset", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
url = "2.5.8"
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
