[package]
name = "bebra-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-less core of the launcher: hub, auth, content download, engine launch"

[dependencies]
async-compression = { version = "0.4.50", features = ["zstd", "tokio"] }
base64 = "0.23.1"
blake2 = "0.11.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2", "charset", "stream", "socks"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "serde-well-known", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "fs"] }
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
