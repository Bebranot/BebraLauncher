name: Release installer

# Run by hand (Actions -> Release installer -> Run workflow): builds an UNSIGNED installer as an
# artifact, for trying. Real releases (signed, with the changelog text) come from scripts/release.ps1.
on:
  workflow_dispatch:

# Build and upload an artifact only: no repository write access is needed.
permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      # Pinned by commit SHA; the tag comment is for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build the installer
        shell: pwsh
        run: scripts/build-release.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BebraLauncher-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
