name: Release installer

# Run by hand (Actions -> Release installer -> Run workflow): builds an UNSIGNED installer as an
# artifact, for trying. Real releases (signed, with the changelog text) come from scripts/release.ps1.
on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the installer
        shell: pwsh
        run: scripts/build-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BebraLauncher-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
